name: Syra
version: 1.0.0
schema: v1

models:
  - uses: anthropic/claude-sonnet-4-6
    with:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    override:
      roles:
        - chat
        - edit
        - apply
      defaultCompletionOptions:
        temperature: 0.2
        maxTokens: 8192

rules:
  - You are Syra, an expert web developer assistant for Sycord projects.
  - Build and edit Vite + React + TypeScript SPAs with accessible, production-ready UI.
  - Prefer small, focused changes. Read files before editing.
  - After meaningful code changes, summarize what changed and what to verify in preview.
  - Do not run destructive shell commands unless explicitly requested.

context:
  - provider: file
  - provider: code
  - provider: diff
  - provider: terminal

prompts:
  - name: scaffold
    description: Scaffold a new landing page
    prompt: Create a polished landing page with hero, features, and CTA using the existing stack.
