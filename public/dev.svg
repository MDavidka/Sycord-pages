<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 280 100" fill="none" aria-hidden="true">
  <!-- Compact laurel badge: left wreath, center copy, mirrored right wreath -->
  <defs>
    <path id="leaf" d="M0 0C2.2-4.8 6.4-8.2 11-9.2C7.6-4.2 5.8.6 6.2 5.6C2.8 3.2.6 1.4 0 0Z"/>
    <g id="wreath">
      <g fill="#fff" fill-opacity=".92">
        <use xlink:href="#leaf" transform="translate(18 78) rotate(-18)"/>
        <use xlink:href="#leaf" transform="translate(14 68) rotate(-8)"/>
        <use xlink:href="#leaf" transform="translate(12 57) rotate(2)"/>
        <use xlink:href="#leaf" transform="translate(11 46) rotate(12)"/>
        <use xlink:href="#leaf" transform="translate(12 35) rotate(22)"/>
        <use xlink:href="#leaf" transform="translate(15 25) rotate(34)"/>
        <use xlink:href="#leaf" transform="translate(20 16) rotate(48)"/>
        <use xlink:href="#leaf" transform="translate(27 9) rotate(62)"/>
        <use xlink:href="#leaf" transform="translate(36 5) rotate(76)"/>
      </g>
      <g fill="#fff" fill-opacity=".55">
        <use xlink:href="#leaf" transform="translate(26 74) rotate(-12) scale(.78)"/>
        <use xlink:href="#leaf" transform="translate(22 63) rotate(-2) scale(.78)"/>
        <use xlink:href="#leaf" transform="translate(20 52) rotate(8) scale(.78)"/>
        <use xlink:href="#leaf" transform="translate(19 41) rotate(18) scale(.78)"/>
        <use xlink:href="#leaf" transform="translate(21 30) rotate(30) scale(.78)"/>
        <use xlink:href="#leaf" transform="translate(25 21) rotate(42) scale(.78)"/>
        <use xlink:href="#leaf" transform="translate(32 13) rotate(56) scale(.78)"/>
      </g>
      <path d="M38 82C28 70 22 54 22 38C22 24 28 12 40 4" stroke="#fff" stroke-opacity=".35" stroke-width="1.2" stroke-linecap="round"/>
    </g>
  </defs>

  <use xlink:href="#wreath" x="0" y="0"/>
  <use xlink:href="#wreath" transform="translate(280 0) scale(-1 1)"/>

  <text x="140" y="46" text-anchor="middle" fill="#fff" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="600" letter-spacing="0.01em">made for developers</text>
  <text x="140" y="66" text-anchor="middle" fill="#A7AAB0" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="500" letter-spacing="0.04em">since 2026</text>
</svg>
